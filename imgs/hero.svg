<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1B2B"/><stop offset=".6" stop-color="#12293F"/><stop offset="1" stop-color="#1A3C6E"/>
    </linearGradient>
    <radialGradient id="glow" cx=".7" cy=".35" r=".5">
      <stop offset="0" stop-color="#F4831F" stop-opacity=".28"/><stop offset="1" stop-color="#F4831F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lines" width="1600" height="34" patternUnits="userSpaceOnUse">
      <rect x="0" y="16" width="1600" height="2" fill="#F7F1E8" opacity=".04"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#lines)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- trang văn bản luật mờ phía sau -->
  <g opacity=".10" fill="#F7F1E8" font-family="Georgia,serif">
    <text x="90" y="150" font-size="30" font-weight="700">ĐIỀU 1.</text>
    <rect x="90" y="175" width="520" height="8"/><rect x="90" y="200" width="470" height="8"/><rect x="90" y="225" width="500" height="8"/>
    <text x="90" y="300" font-size="30" font-weight="700">ĐIỀU 2.</text>
    <rect x="90" y="325" width="480" height="8"/><rect x="90" y="350" width="530" height="8"/><rect x="90" y="375" width="300" height="8"/>
    <text x="90" y="450" font-size="30" font-weight="700">ĐIỀU 3.</text>
    <rect x="90" y="475" width="510" height="8"/><rect x="90" y="500" width="440" height="8"/>
  </g>

  <!-- cán cân -->
  <g fill="none" stroke="#F4831F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" transform="translate(1180 70) scale(.78)">
    <line x1="0" y1="40" x2="0" y2="520"/>
    <circle cx="0" cy="26" r="16" fill="#F4831F"/>
    <path d="M-120 520 H120"/>
    <path d="M-260 110 H260"/>
    <path d="M-260 110 L-340 300 M-260 110 L-180 300"/>
    <path d="M-355 300 Q-260 380 -165 300 Z" fill="#F4831F" fill-opacity=".12"/>
    <path d="M260 110 L180 260 M260 110 L340 260"/>
    <path d="M165 260 Q260 340 355 260 Z" fill="#F4831F" fill-opacity=".12"/>
  </g>

  <!-- bong bóng chat -->
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="1130" y="300" width="330" height="80" rx="26" fill="#F7F1E8"/>
    <path d="M1420 380 l26 24 l-4 -28 z" fill="#F7F1E8"/>
    <text x="1158" y="349" font-size="26" fill="#2B2620">Chủ trọ giữ cọc có đúng?</text>
    <rect x="930" y="410" width="400" height="96" rx="26" fill="#F4831F"/>
    <path d="M970 506 l-22 22 l30 -8 z" fill="#F4831F"/>
    <text x="958" y="452" font-size="24" fill="#0A1B2B" font-weight="700">Có 2 điều luật liên quan</text>
    <text x="958" y="486" font-size="21" fill="#0A1B2B">Bấm để đọc văn bản gốc ↗</text>
  </g>
</svg>
