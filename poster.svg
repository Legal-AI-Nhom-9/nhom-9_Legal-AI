<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Segoe UI,Arial,sans-serif">
  <rect width="1200" height="900" fill="#F7F1E8"/>
  <text x="600" y="110" font-size="60" font-weight="800" fill="#1A3C6E" text-anchor="middle">Hỏi luật dễ như nhắn tin</text>
  <text x="600" y="165" font-size="28" fill="#2B2620" opacity=".7" text-anchor="middle">Ba bước dùng Legal AI</text>

  <g transform="translate(90 230)">
    <rect width="300" height="400" rx="24" fill="#12293F"/>
    <text x="40" y="100" font-size="90" font-weight="800" fill="#F4831F">1</text>
    <text font-size="34" font-weight="700" fill="#F7F1E8"><tspan x="40" y="190">Hỏi bằng</tspan><tspan x="40" y="234">tiếng Việt</tspan></text>
    <text font-size="24" fill="#F7F1E8" opacity=".7"><tspan x="40" y="300">Thuê trọ, lao động,</tspan><tspan x="40" y="334">mua bán online</tspan></text>
  </g>
  <g transform="translate(450 230)">
    <rect width="300" height="400" rx="24" fill="#1A3C6E"/>
    <text x="40" y="100" font-size="90" font-weight="800" fill="#F4831F">2</text>
    <text font-size="34" font-weight="700" fill="#F7F1E8"><tspan x="40" y="190">Đọc điều luật</tspan><tspan x="40" y="234">gốc</tspan></text>
    <text font-size="24" fill="#F7F1E8" opacity=".7"><tspan x="40" y="300">Có tên văn bản, số điều</tspan><tspan x="40" y="334">và link để tự kiểm tra</tspan></text>
  </g>
  <g transform="translate(810 230)">
    <rect width="300" height="400" rx="24" fill="#F4831F"/>
    <text x="40" y="100" font-size="90" font-weight="800" fill="#0A1B2B">3</text>
    <text font-size="34" font-weight="700" fill="#0A1B2B"><tspan x="40" y="190">Biết khi nào</tspan><tspan x="40" y="234">cần luật sư</tspan></text>
    <text font-size="24" fill="#0A1B2B" opacity=".75"><tspan x="40" y="300">Vụ việc phức tạp được</tspan><tspan x="40" y="334">chỉ tới nơi trợ giúp</tspan></text>
  </g>
  <g fill="#F4831F"><path d="M402 430 l30 0 l-10 -12 M432 430 l-10 12" stroke="#F4831F" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M762 430 l30 0 l-10 -12 M792 430 l-10 12" stroke="#F4831F" stroke-width="6" fill="none" stroke-linecap="round"/></g>
  <text x="600" y="730" font-size="30" font-weight="800" fill="#1A3C6E" text-anchor="middle">LEGAL AI · Trợ lý pháp lý thông minh</text>
  <text x="600" y="840" font-size="20" fill="#2B2620" opacity=".6" text-anchor="middle">Hình minh hoạ có sử dụng AI tạo sinh · Không thay thế tư vấn của luật sư</text>
</svg>
